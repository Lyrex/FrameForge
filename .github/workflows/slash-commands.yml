name: Slash Commands

on:
  issue_comment:
    types: [created]

jobs:
  handle:
    # Only fire on issue comments (not PR comments) from the repo owner
    if: >
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'Sikewyrm'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Parse command
        id: parse
        run: |
          BODY="${{ github.event.comment.body }}"
          BODY_TRIMMED=$(echo "$BODY" | xargs)
          echo "command=$BODY_TRIMMED" >> $GITHUB_OUTPUT

      # /pending-feedback — remove needs-triage, add Closed - Pending Feedback
      - name: pending-feedback
        if: steps.parse.outputs.command == '/pending-feedback'
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.issue.number;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // Remove needs-triage (ignore error if not present)
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'needs-triage' });
            } catch (_) {}

            // Add Closed - Pending Feedback
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['Closed - Pending Feedback'] });

            // React with eyes to confirm the command was seen
            await github.rest.reactions.createForIssueComment({
              owner, repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      # /confirmed — remove needs-triage, add confirmed
      - name: confirmed
        if: steps.parse.outputs.command == '/confirmed'
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.issue.number;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'needs-triage' });
            } catch (_) {}
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['confirmed'] });
            await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: context.payload.comment.id, content: '+1' });

      # /wontfix — remove needs-triage, add wontfix, close issue
      - name: wontfix
        if: steps.parse.outputs.command == '/wontfix'
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.issue.number;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'needs-triage' });
            } catch (_) {}
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['wontfix'] });
            await github.rest.issues.update({ owner, repo, issue_number: issue, state: 'closed', state_reason: 'not_planned' });
            await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: context.payload.comment.id, content: '+1' });

      # /duplicate — remove needs-triage, add duplicate, close issue
      - name: duplicate
        if: steps.parse.outputs.command == '/duplicate'
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.issue.number;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'needs-triage' });
            } catch (_) {}
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['duplicate'] });
            await github.rest.issues.update({ owner, repo, issue_number: issue, state: 'closed', state_reason: 'not_planned' });
            await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: context.payload.comment.id, content: '+1' });

      # /parked — remove needs-triage, add Parked, close issue
      - name: parked
        if: steps.parse.outputs.command == '/parked'
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.issue.number;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'needs-triage' });
            } catch (_) {}
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['Parked'] });
            await github.rest.issues.update({ owner, repo, issue_number: issue, state: 'closed', state_reason: 'not_planned' });
            await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: context.payload.comment.id, content: '+1' });

      # /in-progress — remove needs-triage, add in-progress
      - name: in-progress
        if: steps.parse.outputs.command == '/in-progress'
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.issue.number;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'needs-triage' });
            } catch (_) {}
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['in-progress'] });
            await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: context.payload.comment.id, content: 'rocket' });

      # /resolved — add resolved, close issue
      - name: resolved
        if: steps.parse.outputs.command == '/resolved'
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.issue.number;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['resolved'] });
            await github.rest.issues.update({ owner, repo, issue_number: issue, state: 'closed', state_reason: 'completed' });
            await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: context.payload.comment.id, content: '+1' });
